[project]
name = "backend"
version = "0.1.0"
description = "Local-first movie production API and persistent generation worker"
readme = "README.md"
authors = [
    { name = "Gideon", email = "dongidomed@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huey>=3.3.4",
    "pillow>=11.3.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
movie-api = "backend.cli:run_api"
movie-worker = "backend.cli:run_worker"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
